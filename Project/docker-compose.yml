services:
  # ============================================================
  # MySQL Database Service
  # Runs isolated with 7 dedicated microservice schemas.
  # Host port mapped to 3307 to avoid conflict with local MySQL.
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: smartcampus-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-smartcampus_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_campus_auth}
      MYSQL_USER: ${MYSQL_USER:-smartcampus_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smartcampus_pass}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-smartcampus_root} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - smartcampus-network

  # ============================================================
  # Authentication Service
  # Port: 8081
  # ============================================================
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: smartcampus-auth-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: smart_campus_auth
      DB_USERNAME: ${MYSQL_USER:-smartcampus_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-smartcampus_pass}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-CampusAdmin@123}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@smartcampus.com}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 40s
    networks:
      - smartcampus-network

  # ============================================================
  # Student Service
  # Port: 8082
  # ============================================================
  student-service:
    build:
      context: ./backend/student-service
      dockerfile: Dockerfile
    container_name: smartcampus-student-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: smart_campus_student
      DB_USERNAME: ${MYSQL_USER:-smartcampus_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-smartcampus_pass}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8081}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 40s
    networks:
      - smartcampus-network

  # ============================================================
  # Academic Service
  # Port: 8083
  # ============================================================
  academic-service:
    build:
      context: ./backend/academic-service
      dockerfile: Dockerfile
    container_name: smartcampus-academic-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8083
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: smart_campus_academic
      DB_USERNAME: ${MYSQL_USER:-smartcampus_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-smartcampus_pass}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8081}
      STUDENT_SERVICE_URL: ${STUDENT_SERVICE_URL:-http://student-service:8082}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started
      student-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 40s
    networks:
      - smartcampus-network

  # ============================================================
  # Attendance Service
  # Port: 8084
  # ============================================================
  attendance-service:
    build:
      context: ./backend/attendance-service
      dockerfile: Dockerfile
    container_name: smartcampus-attendance-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8084
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: smart_campus_attendance
      DB_USERNAME: ${MYSQL_USER:-smartcampus_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-smartcampus_pass}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8081}
      STUDENT_SERVICE_URL: ${STUDENT_SERVICE_URL:-http://student-service:8082}
      ACADEMIC_SERVICE_URL: ${ACADEMIC_SERVICE_URL:-http://academic-service:8083}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started
      student-service:
        condition: service_started
      academic-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 40s
    networks:
      - smartcampus-network

  # ============================================================
  # Event Service
  # Port: 8085
  # ============================================================
  event-service:
    build:
      context: ./backend/event-service
      dockerfile: Dockerfile
    container_name: smartcampus-event-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8085
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: smart_campus_event
      DB_USERNAME: ${MYSQL_USER:-smartcampus_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-smartcampus_pass}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8081}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8085:8085"
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8085/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 40s
    networks:
      - smartcampus-network

  # ============================================================
  # Facility Service
  # Port: 8086
  # ============================================================
  facility-service:
    build:
      context: ./backend/facility-service
      dockerfile: Dockerfile
    container_name: smartcampus-facility-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8086
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: smart_campus_facility
      DB_USERNAME: ${MYSQL_USER:-smartcampus_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-smartcampus_pass}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8081}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8086:8086"
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8086/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 40s
    networks:
      - smartcampus-network

  # ============================================================
  # Notification Service
  # Port: 8087
  # ============================================================
  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: smartcampus-notification-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8087
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: smart_campus_notification
      DB_USERNAME: ${MYSQL_USER:-smartcampus_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-smartcampus_pass}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8081}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8087:8087"
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8087/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 40s
    networks:
      - smartcampus-network

  # ============================================================
  # API Gateway
  # Port: 8080
  # Routes requests to the 7 domain microservices.
  # ============================================================
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: smartcampus-api-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8081}
      STUDENT_SERVICE_URL: ${STUDENT_SERVICE_URL:-http://student-service:8082}
      ACADEMIC_SERVICE_URL: ${ACADEMIC_SERVICE_URL:-http://academic-service:8083}
      ATTENDANCE_SERVICE_URL: ${ATTENDANCE_SERVICE_URL:-http://attendance-service:8084}
      EVENT_SERVICE_URL: ${EVENT_SERVICE_URL:-http://event-service:8085}
      FACILITY_SERVICE_URL: ${FACILITY_SERVICE_URL:-http://facility-service:8086}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8087}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    depends_on:
      - auth-service
      - student-service
      - academic-service
      - attendance-service
      - event-service
      - facility-service
      - notification-service
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 40s
    networks:
      - smartcampus-network

  # ============================================================
  # Frontend (React + Vite served via Nginx)
  # Port: 5173 (maps container 80 -> host 5173)
  # Reverse-proxies /api/ requests to api-gateway:8080
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartcampus-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - smartcampus-network

# ============================================================
# Persistent Storage Volumes
# ============================================================
volumes:
  mysql_data:
    name: smartcampus_mysql_data

# ============================================================
# Private Overlay Bridge Network
# ============================================================
networks:
  smartcampus-network:
    name: smartcampus_network
    driver: bridge

