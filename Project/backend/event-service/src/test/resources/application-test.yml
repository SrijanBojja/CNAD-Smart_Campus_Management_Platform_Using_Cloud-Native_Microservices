server:
  port: 0

spring:
  application:
    name: event-service-test

  datasource:
    url: jdbc:h2:mem:smart_campus_event_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci1ldmVudC1zZXJ2aWNlLXVuaXQtdGVzdHMtMjU2LWJpdHM=
  expiration-ms: 86400000

auth-service:
  url: http://localhost:8081
  connect-timeout-ms: 2000
  read-timeout-ms: 2000

cors:
  allowed-origins: http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: WARN
    com.smartcampus.event: DEBUG
