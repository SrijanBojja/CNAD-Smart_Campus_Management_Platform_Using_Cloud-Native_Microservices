server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_campus_notification}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:smartcampus_user}
    password: ${DB_PASSWORD:smartcampus_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

jwt:
  secret: ${JWT_SECRET:dGVzdC1zZWNyZXQta2V5LWZvci1zbWFydC1jYW1wdXMtbm90aWZpY2F0aW9uLXNlcnZpY2UtMjU2LWJpdHM=}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

auth-service:
  url: ${AUTH_SERVICE_URL:http://localhost:8081}
  connect-timeout-ms: 5000
  read-timeout-ms: 5000

cors:
  allowed-origins: ${FRONTEND_URL:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
