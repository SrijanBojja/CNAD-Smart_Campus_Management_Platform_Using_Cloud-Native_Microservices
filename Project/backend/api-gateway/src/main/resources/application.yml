server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**

        - id: student-service-route
          uri: ${STUDENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/students/**

        - id: academic-service-courses-route
          uri: ${ACADEMIC_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/courses/**

        - id: academic-service-subjects-route
          uri: ${ACADEMIC_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/subjects/**

        - id: academic-service-enrollments-route
          uri: ${ACADEMIC_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/enrollments/**

        - id: academic-service-records-route
          uri: ${ACADEMIC_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/academic-records/**

        - id: academic-service-schedules-route
          uri: ${ACADEMIC_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/schedules/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${FRONTEND_URL:http://localhost:5173}
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - Authorization
              - Content-Type
              - X-Requested-With
              - Accept
              - Origin
            allow-credentials: true
            max-age: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
