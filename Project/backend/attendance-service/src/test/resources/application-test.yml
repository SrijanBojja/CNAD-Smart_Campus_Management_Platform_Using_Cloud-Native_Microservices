server:
  port: 0

spring:
  application:
    name: attendance-service-test

  datasource:
    url: jdbc:h2:mem:smart_campus_attendance_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

jwt:
  secret: dGhpcy1pcy1hLXNhbXBsZS10ZXN0LXNlY3JldC1rZXktZm9yLXVuaXQtdGVzdGluZy1wdXJwb3Nlcy1vbmx5Cg==
  expiration-ms: 3600000

auth-service:
  url: http://localhost:8081
  connect-timeout-ms: 2000
  read-timeout-ms: 2000

student-service:
  url: http://localhost:8082
  connect-timeout-ms: 2000
  read-timeout-ms: 2000

academic-service:
  url: http://localhost:8083
  connect-timeout-ms: 2000
  read-timeout-ms: 2000

cors:
  allowed-origins: http://localhost:5173

logging:
  level:
    root: INFO
    com.smartcampus.attendance: DEBUG
    org.springframework.security: WARN
